substitutions:
  _REGION: us-central1
  _REPOSITORY: custom-wishlist
  _SERVICE: custom-wishlist
  _CLOUD_SQL_INSTANCE: project:region:instance
  _APP_URL: https://replace-with-your-domain.example.com

steps:
  - name: gcr.io/cloud-builders/docker
    args:
      - build
      - -t
      - ${_REGION}-docker.pkg.dev/$PROJECT_ID/${_REPOSITORY}/${_SERVICE}:$COMMIT_SHA
      - .

  - name: gcr.io/cloud-builders/docker
    args:
      - push
      - ${_REGION}-docker.pkg.dev/$PROJECT_ID/${_REPOSITORY}/${_SERVICE}:$COMMIT_SHA

  - name: gcr.io/google.com/cloudsdktool/cloud-sdk
    entrypoint: gcloud
    args:
      - run
      - deploy
      - ${_SERVICE}
      - --image=${_REGION}-docker.pkg.dev/$PROJECT_ID/${_REPOSITORY}/${_SERVICE}:$COMMIT_SHA
      - --region=${_REGION}
      - --platform=managed
      - --allow-unauthenticated
      - --port=3000
      - --add-cloudsql-instances=${_CLOUD_SQL_INSTANCE}
      - --min=1
      - --set-env-vars=^|^NODE_ENV=production|SHOPIFY_APP_URL=${_APP_URL}|SCOPES=write_customers,write_products,write_metaobjects,write_metaobject_definitions
      - --set-secrets=SHOPIFY_API_KEY=shopify-api-key:latest,SHOPIFY_API_SECRET=shopify-api-secret:latest,DATABASE_URL=database-url:latest

images:
  - ${_REGION}-docker.pkg.dev/$PROJECT_ID/${_REPOSITORY}/${_SERVICE}:$COMMIT_SHA

options:
  logging: CLOUD_LOGGING_ONLY
